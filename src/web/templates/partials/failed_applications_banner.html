{% if failed_count > 0 %}
<div class="mb-4 p-4 rounded-xl border border-red-200 bg-red-50 dark:border-red-900 dark:bg-red-950/30 flex flex-wrap items-center justify-between gap-3">
  <div>
    <p class="text-sm font-medium text-red-900 dark:text-red-200">{{ failed_count }} failed application{{ 's' if failed_count != 1 else '' }}</p>
    <p class="text-xs text-red-700 dark:text-red-300 mt-1">Retry auto-apply after fixing browser, network, or config issues.</p>
  </div>
  <div class="flex flex-wrap gap-2">
    <a href="/applications?tab=history&status=failed"
       {% if hx_target %}hx-get="/applications?tab=history&status=failed" hx-target="{{ hx_target }}" hx-swap="innerHTML" hx-push-url="true"{% endif %}
       class="px-3 py-1.5 text-sm border border-red-300 text-red-800 rounded-lg hover:bg-red-100 dark:border-red-800 dark:text-red-200 dark:hover:bg-red-950/50">View failed</a>
    <form method="post" action="/applications/retry-failed" class="inline">
      <input type="hidden" name="tab" value="{{ filter_tab|default('history') }}">
      <input type="hidden" name="status" value="{{ filter_status|default('') }}">
      <input type="hidden" name="min_score" value="{{ filter_min_score|default('') }}">
      <button type="submit" class="px-3 py-1.5 text-sm bg-red-600 text-white rounded-lg hover:bg-red-700">Retry all failed</button>
    </form>
  </div>
</div>
{% endif %}

{% if failed_jobs %}
<div class="bg-white dark:bg-stone-900 rounded-xl p-4 shadow-sm border border-red-200 dark:border-red-900 mb-4">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
    <h3 class="font-semibold text-red-900 dark:text-red-200">Failed applications</h3>
    <a href="/applications?tab=history&status=failed" class="text-sm text-brand hover:underline">View all</a>
  </div>
  <ul class="space-y-3">
    {% for j in failed_jobs %}
    <li class="flex flex-wrap items-start justify-between gap-3 p-3 rounded-lg bg-red-50 dark:bg-red-950/20 border border-red-100 dark:border-red-900">
      <div class="min-w-0">
        <a href="/job/{{ j.id }}" class="font-medium text-stone-900 dark:text-stone-100 hover:text-brand truncate block">{{ j.title or 'Untitled' }}</a>
        <p class="text-sm text-stone-500 dark:text-stone-400">{{ j.company or '' }}</p>
        {% if j.apply_result %}
        <p class="text-xs text-red-700 dark:text-red-300 mt-1 line-clamp-2">{{ parse_apply_result(j.apply_result) }}</p>
        {% endif %}
      </div>
      <form method="post" action="/applications/{{ j.id }}/retry" class="shrink-0">
        <input type="hidden" name="tab" value="history">
        <input type="hidden" name="status" value="failed">
        <button type="submit" class="px-3 py-1.5 text-sm bg-red-600 text-white rounded-lg hover:bg-red-700">Retry</button>
      </form>
    </li>
    {% endfor %}
  </ul>
</div>
{% endif %}

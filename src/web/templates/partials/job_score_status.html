<div id="job-score-status"
  {% if running %}
  hx-get="/partials/job/{{ job_id }}/score-status"
  hx-trigger="every 2s"
  hx-swap="outerHTML"
  {% endif %}
  class="rounded-xl p-4 mb-4 text-sm
  {% if error %}bg-red-50 dark:bg-red-950/30 border border-red-100 dark:border-red-900 text-red-800 dark:text-red-300
  {% elif running %}bg-blue-50 dark:bg-blue-950/30 border border-blue-100 dark:border-blue-900 text-blue-900 dark:text-blue-200
  {% else %}bg-green-50 dark:bg-green-950/30 border border-green-100 dark:border-green-900 text-green-800 dark:text-green-300{% endif %}">
  {% if error %}
  <p class="font-medium">Scoring failed</p>
  <p class="mt-1">{{ error }}</p>
  {% elif running %}
  <p class="font-medium flex items-center gap-2">
    <span class="inline-block w-4 h-4 border-2 border-brand border-t-transparent rounded-full animate-spin"></span>
    Scoring job with LLM…
  </p>
  <p class="mt-1 text-xs opacity-80">This usually takes 30–90 seconds. The page will refresh when done.</p>
  {% else %}
  <p class="font-medium">Scoring complete</p>
  {% endif %}
</div>

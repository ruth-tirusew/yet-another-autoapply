<span class="inline-flex flex-col gap-0.5" title="Provider: {{ configured.provider }}&#10;Default: {{ configured.default_model }}{% if not configured.default_available %} (not available){% endif %}&#10;Quality: {{ configured.quality_model }}{% if not configured.quality_available %} (not available){% endif %}">
  <span class="inline-flex items-center gap-1.5 text-sm">
    <span class="w-2 h-2 rounded-full {% if status.reachable %}bg-emerald-500{% else %}bg-red-500{% endif %}"></span>
    {{ status.provider | capitalize }}{% if status.provider == 'ollama' %} @ {{ status.host }}{% endif %}
  </span>
  <span class="text-xs text-slate-500 dark:text-slate-400 pl-1">Default: {{ configured.default_model }}{% if not configured.default_available %} ⚠{% endif %}</span>
  <span class="text-xs text-slate-500 dark:text-slate-400 pl-1">Quality: {{ configured.quality_model }}{% if not configured.quality_available %} ⚠{% endif %}</span>
</span>

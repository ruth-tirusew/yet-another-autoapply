{% if preview_mode == 'manual' %}
<p><span class="text-slate-500 dark:text-slate-400">Manual:</span> <code class="text-brand">{{ preview_query or '(empty)' }}</code></p>
{% else %}
<p><span class="text-slate-500 dark:text-slate-400">Auto from keywords:</span> <code class="text-brand">{{ preview_query or '(no keywords configured)' }}</code></p>
{% endif %}

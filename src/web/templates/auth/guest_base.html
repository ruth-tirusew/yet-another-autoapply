<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Crawler{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#4859FF' } } }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    html { color-scheme: light; }
    html.dark { color-scheme: dark; }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-brand">Job Crawler</h1>
      <p class="text-sm text-stone-500 dark:text-stone-400 mt-1">{% block subtitle %}{% endblock %}</p>
    </div>
    <div class="bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-xl p-8 shadow-sm">
      {% block content %}{% endblock %}
    </div>
    <p class="text-center text-sm text-stone-500 dark:text-stone-400 mt-6">
      {% block footer_link %}{% endblock %}
    </p>
  </div>
</body>
</html>

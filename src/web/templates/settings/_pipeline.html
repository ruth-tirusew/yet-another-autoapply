<form hx-post="/settings/save/pipeline" hx-swap="none" class="space-y-4 max-w-lg">
  <div>
    <label class="block text-sm font-medium mb-1 text-slate-900 dark:text-slate-100">Match threshold (0–100)</label>
    <input type="number" name="match_threshold" value="{{ pipeline.match_threshold }}" min="0" max="100" class="w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 text-sm">
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-sm font-medium mb-1 text-slate-900 dark:text-slate-100">Role fit minimum (0–25)</label>
      <input type="number" name="role_fit_min" value="{{ pipeline.role_fit_min or 15 }}" min="0" max="25" class="w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1 text-slate-900 dark:text-slate-100">Maybe score boost</label>
      <input type="number" name="maybe_score_boost" value="{{ pipeline.maybe_score_boost or 10 }}" min="0" max="50" class="w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1 text-slate-900 dark:text-slate-100">Description fetch limit</label>
      <input type="number" name="enrich_limit" value="{{ pipeline.enrich_limit }}" class="w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1 text-slate-900 dark:text-slate-100">Match limit (new → scored per run)</label>
      <input type="number" name="match_limit" value="{{ pipeline.match_limit }}" class="w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1 text-slate-900 dark:text-slate-100">Generate limit</label>
      <input type="number" name="generate_limit" value="{{ pipeline.generate_limit }}" class="w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1 text-slate-900 dark:text-slate-100">Stale days</label>
      <input type="number" name="stale_days" value="{{ pipeline.stale_days }}" class="w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1 text-slate-900 dark:text-slate-100">Description fetch delay (s)</label>
      <input type="number" step="0.1" name="enrich_delay_seconds" value="{{ pipeline.enrich_delay_seconds }}" class="w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1 text-slate-900 dark:text-slate-100">Crawl delay (s)</label>
      <input type="number" step="0.1" name="crawl_delay_seconds" value="{{ pipeline.crawl_delay_seconds }}" class="w-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-3 py-2 text-sm">
    </div>
  </div>
  <button type="submit" class="px-4 py-2 bg-brand text-white rounded-lg text-sm font-medium hover:opacity-90">Save</button>
</form>

<form hx-post="/settings/save/hiring_agent" hx-swap="none" class="space-y-4 max-w-lg">
  <p class="text-sm text-slate-600 dark:text-slate-400">hiring_agent powers PDF extraction, GitHub enrichment, profile evaluation, and match/cover letter context. Uses the <strong>quality model</strong> from the Models tab.</p>
  <label class="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300">
    <input type="checkbox" name="evaluate_on_upload" value="true" {% if hiring_agent.evaluate_on_upload %}checked{% endif %} class="rounded">
    Run profile evaluation on CV upload
  </label>
  <p class="text-sm text-slate-500 dark:text-slate-400">
    <a href="/profile" class="text-brand hover:underline">Profile page</a> — upload CV or re-run evaluation manually.
  </p>
  <button type="submit" class="px-4 py-2 bg-brand text-white rounded-lg text-sm font-medium hover:opacity-90">Save</button>
</form>
